# GitHub Codespaces override (4-core / 16 GB). Use it on top of the base file:
#
#   docker compose -f docker-compose.yml -f deploy/codespaces/docker-compose.codespaces.yml up -d
#
# or just run deploy/codespaces/start.sh. Relative paths resolve against the
# repository root (the directory of the first compose file).
#
# What changes against docker-compose.yml:
# - backend: runs the code baked into the image (no bind mount of the source
#   tree, whose owner is not the image's appuser), keeps jobs, uploads and the
#   Whisper model cache in named volumes, publishes no port, and is sized for
#   one job at a time.
# - frontend: the production dashboard build behind nginx, which also proxies
#   the API on the same origin. Bound to 127.0.0.1 only; Codespaces forwards
#   it as a private port.
# - renderer: kept, but only started with `--profile renderer` (nothing in the
#   dashboard calls it today).
name: openshorts

services:
  backend:
    volumes: !override
      - output:/app/output
      - uploads:/app/uploads
      - models:/app/.cache
    ports: !reset []
    environment:
      # Optional server-side fallback; the dashboard sends the key saved in its
      # Settings page with every request. Empty when the secret is not set.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      MAX_CONCURRENT_JOBS: "1"
      CLIP_WORKERS: "2"
      ASR_HOST_SLOTS: "1"
      FFMPEG_THREADS: "2"
      # Disk on a 32 GB Codespace also holds ~10 GB of images and build cache.
      OUTPUT_MAX_GB: "8"
      UPLOADS_MAX_GB: "4"
      # Keep finished jobs 3 days so they survive a stop/start; the size caps
      # above still delete the oldest first when the disk fills.
      JOB_RETENTION_SECONDS: "259200"
      # Must stay below stop_grace_period: a job cut by a stop is resumed on
      # the next start from its manifest.
      DRAIN_TIMEOUT_SECONDS: "20"
    mem_limit: 13g
    stop_grace_period: 30s

  frontend:
    build:
      context: ./dashboard
      target: prod
    volumes: !override
      - ./deploy/codespaces/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports: !override
      - "127.0.0.1:8080:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3

  renderer:
    profiles: ["renderer"]
    volumes: !override
      - output:/output
    ports: !reset []

volumes:
  output:
  uploads:
  models:
