# Dashboard (static production build) + backend on one origin, for the
# Codespaces override. Replaces dashboard/nginx.conf, which is written for
# openshorts.app and serves no API.

map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    # Same ceiling as the backend (MAX_FILE_SIZE_MB = 2048).
    client_max_body_size 2g;

    # Docker's DNS, re-resolved so a restarted backend is found again.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8000;

    location ~ ^/(api|videos|thumbnails|gallery|video|mcp|health|docs|openapi\.json)(/|$) {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Connection "";
        # Stream uploads and clip downloads instead of spooling them to disk.
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri.html $uri/ /index.html;
        add_header Cache-Control "no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }
}
